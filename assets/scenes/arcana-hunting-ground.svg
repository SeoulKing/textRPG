<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">아르카나 사냥터의 슬라임</title>
  <desc id="desc">별이 흐르는 밤하늘 아래 푸른 초원에서 초록빛 슬라임이 모습을 드러낸다.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10163b"/>
      <stop offset="0.58" stop-color="#273b6f"/>
      <stop offset="1" stop-color="#6b6eb0"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#355a68"/>
      <stop offset="1" stop-color="#122d32"/>
    </linearGradient>
    <radialGradient id="slime" cx="42%" cy="28%" r="70%">
