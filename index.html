<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>폐허 서울: 캠프 생존</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=20260729-inventory-dock">
</head>
<body>
  <section id="home-screen" class="home-screen">
    <div class="home-backdrop" aria-hidden="true"></div>
    <div class="home-content">
      <p class="home-kicker">10일 구조 대기 생존</p>
      <h1>폐허 서울</h1>
      <p id="home-save-status" class="home-save-status">저장된 게임을 확인하고 있습니다.</p>
      <div class="home-actions">
        <button id="home-new-game" class="home-action primary" type="button">새 게임</button>
        <button id="home-continue" class="home-action" type="button" disabled>이어하기</button>
        <button id="home-fullscreen-play" class="home-action fullscreen" type="button">전체화면으로 플레이</button>
        <a class="home-action studio" href="/content-editor">콘텐츠 스튜디오</a>
      </div>
      <div id="home-auth-panel" class="home-auth-panel">
        <p id="home-auth-status" class="home-auth-status">로그인 상태를 확인하고 있습니다.</p>
        <a id="home-kakao-login" class="home-auth-button kakao" href="/api/auth/kakao/start">
          <span class="kakao-symbol" aria-hidden="true"></span>
          <span>카카오 로그인</span>
        </a>
        <button id="home-logout" class="home-auth-button" type="button" hidden>로그아웃</button>
      </div>
    </div>
  </section>

  <div class="app-shell" hidden>
    <section class="story-shell">
      <header class="status-strip">
        <div class="status-grid">
          <button id="hp-status" class="status-trigger" data-stat="hp" type="button" aria-label="체력 상세 보기">
            <span class="status-icon" aria-hidden="true">❤️</span>
            <span class="visually-hidden">체력</span>
            <span class="meter compact">
              <span id="hp-fill"></span>
            </span>
          </button>
          <button id="mind-status" class="status-trigger" data-stat="mind" type="button" aria-label="정신력 상세 보기">
            <span class="status-icon" aria-hidden="true">🧠</span>
            <span class="visually-hidden">정신력</span>
            <span class="meter compact">
              <span id="mind-fill"></span>
            </span>
          </button>
          <button id="energy-status" class="status-trigger" data-stat="energy" type="button" aria-label="기력 상세 보기">
            <span class="status-icon" aria-hidden="true">⚡</span>
            <span class="visually-hidden">기력</span>
            <span class="meter compact">
              <span id="energy-fill"></span>
            </span>
          </button>
          <section class="status-chip status-time">
            <strong id="time-indicator">1일차 06:00</strong>
          </section>
        </div>
        <div id="status-popover" class="status-popover" hidden></div>
      </header>
      <main class="story-stage">
        <section class="scene-frame">
          <div class="scene-art-wrap">
            <img id="scene-art" src="assets/scenes/camp.svg" alt="현재 장면 일러스트">
            <div class="scene-overlay">
              <span id="scene-location-badge" class="pill">생존자 캠프</span>
              <span id="scene-risk-badge" class="pill muted">안전</span>
            </div>
          </div>
          <div class="scene-copy">
            <div id="scene-dev-source" class="scene-dev-source" hidden></div>
            <div id="scene-text" class="scene-text"></div>
            <div id="system-note" class="system-note" hidden></div>
            <div id="choices" class="choice-list"></div>
          </div>
        </section>
      </main>
    </section>

    <footer class="utility-dock">
      <nav class="dock-buttons" aria-label="보조 메뉴">
        <button class="dock-button" data-panel="menu" type="button">메뉴</button>
        <button class="dock-button" data-panel="inventory" type="button">아이템</button>
        <button class="dock-button" data-panel="status" type="button">상태</button>
        <button class="dock-button" data-panel="quests" type="button">퀘스트</button>
        <button class="dock-button" data-panel="map" type="button">이동</button>
      </nav>
      <section class="panel-shell">
        <div class="panel-header">
          <p id="panel-title">지도</p>
        </div>
        <div id="panel-content" class="panel-content"></div>
      </section>
    </footer>
  </div>

  <template id="choice-template">
    <button class="choice-button" type="button">
      <span class="choice-label-row">
        <span class="choice-label"></span>
        <span class="choice-side">
          <span class="choice-status" hidden></span>
          <span class="choice-remaining" hidden></span>
        </span>
      </span>
      <span class="choice-meta"></span>
    </button>
  </template>

  <script type="module" src="app-api.js?v=20260729-travel-overlay-layer"></script>
</body>
</html>
