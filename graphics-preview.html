<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TR 그래픽 미리보기</title>
  <link rel="stylesheet" href="/client/graphics/preview.css">
</head>
<body>
  <main class="preview-shell">
    <header class="preview-header">
      <div>
        <p class="preview-eyebrow">PHASER SCENE LAB</p>
        <h1>요리 장면 미리보기</h1>
      </div>
      <span class="preview-viewport">768 × 224</span>
    </header>

    <section id="preview-frame" class="preview-frame" aria-label="요리 장면 애니메이션">
      <canvas
        id="scene-animation"
        width="768"
        height="224"
        aria-label="요리 장면 Phaser 캔버스"
      ></canvas>
    </section>

    <div class="preview-controls" aria-label="애니메이션 제어">
      <button id="preview-play" type="button">걷기 재생</button>
      <button id="preview-ready" type="button">대기 루프</button>
      <button id="preview-reset" type="button">초기화</button>
    </div>

    <pre id="preview-debug" class="preview-debug" aria-live="polite"></pre>
  </main>
  <script type="module" src="/client/graphics/preview.js?v=20260807-phaser-cooking-v2"></script>
</body>
</html>
