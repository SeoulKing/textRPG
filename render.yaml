services:
  - type: web
    name: textrpg
    runtime: node
    plan: free
    region: singapore
    branch: codex/region-content-structure
    buildCommand: npm ci && npm run build
    startCommand: node .server-dist/server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_LLM_WORLD_PLANNER
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: textrpg-db
          property: connectionString

databases:
  - name: textrpg-db
    plan: free
    region: singapore
    databaseName: textrpg
    user: textrpg
