services:
  - type: web
    name: textrpg
    runtime: node
    plan: free
    region: singapore
    branch: codex/region-content-structure
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node .server-dist/server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_LLM_WORLD_PLANNER
        value: "false"
      - key: ENABLE_LLM_SUBWAY_EXPEDITION
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://textrpg-8ic8.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEON_DATABASE_URL
        sync: false

databases:
  - name: textrpg-db
    plan: free
    region: singapore
    databaseName: textrpg
    user: textrpg
